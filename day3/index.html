<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit</title>
    <script src="script.js" defer></script>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --border-color: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 40px 32px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 12px;
        color: var(--accent);
        letter-spacing: -0.02em;
      }
      p {
        font-size: 1.15rem;
        color: var(--text-muted);
        line-height: 1.6;
      }
      .hint {
        margin-top: 24px;
        font-size: 0.875rem;
        color: #64748b;
        background-color: rgba(15, 23, 42, 0.6);
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px dashed var(--border-color);
      }
      kbd {
        background-color: #334155;
        color: #f1f5f9;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.85em;
        border: 1px solid #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes Toolkit</h1>
      <p>Open the Console to see the results.</p>
      <div class="hint">
        Press <kbd>F12</kbd> or <kbd>Ctrl + Shift + I</kbd> (<kbd>Cmd + Option + I</kbd> on Mac) to view the test outputs in Developer Tools.
      </div>
    </main>
  </body>
</html>
